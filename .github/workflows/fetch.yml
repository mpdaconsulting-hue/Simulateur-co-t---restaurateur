name: fetch-kling
on:
  push:
    branches: [clip-assets-temp]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p videos
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL --retry 3 -o "videos/$name.mp4" "$url"
            ls -la "videos/$name.mp4"
          done < urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos
          git commit -m "Rendus Kling récupérés" || exit 0
          git push
